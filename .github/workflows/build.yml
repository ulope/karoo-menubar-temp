name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create releases for tags
      packages: read # karoo-ext from GitHub Packages
    env:
      GPR_USER: ${{ github.actor }}
      GPR_KEY: ${{ secrets.GITHUB_TOKEN }}
      BUILD_NUMBER: ${{ github.run_number }}
      RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      # Optional: a stable signing key, so new versions install over old ones.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Test and build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk karoo-statusbar-temp.apk

      - uses: actions/upload-artifact@v4
        with:
          name: karoo-statusbar-temp
          path: karoo-statusbar-temp.apk

      - name: Write Karoo app manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download"
          jq -n \
            --arg apk "$base/karoo-statusbar-temp.apk" \
            --arg version "${RELEASE_VERSION#v}" \
            --argjson code "$BUILD_NUMBER" \
            --arg developer "github.com/${GITHUB_REPOSITORY_OWNER}" \
            '{
              label: "Status Bar Temp",
              packageName: "io.github.ulope.karoostatusbartemp",
              latestApkUrl: $apk,
              latestVersion: $version,
              latestVersionCode: $code,
              developer: $developer,
              description: "Shows the current air temperature in the top bar of the ride screen, between the ride time and the battery level.",
              tags: ["weather", "utility"]
            }' > manifest.json
          cat manifest.json

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            karoo-statusbar-temp.apk
            manifest.json
