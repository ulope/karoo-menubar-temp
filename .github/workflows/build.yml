name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this new tag (e.g. v0.1.1), created at the selected branch's head. Leave empty to only build."
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create releases for tags
      packages: read # karoo-ext from GitHub Packages
    env:
      GPR_USER: ${{ github.actor }}
      GPR_KEY: ${{ secrets.GITHUB_TOKEN }}
      BUILD_NUMBER: ${{ github.run_number }}
      # Set when pushing a v* tag, or when started manually with a release tag.
      RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag || '' }}
      # Optional: a stable signing key, so new versions install over old ones.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Test and build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Collect APK
        run: |
          # Releases: karoo-statusbar-temp-0.1.3.apk; other builds: karoo-statusbar-temp-build42.apk
          if [ -n "$RELEASE_VERSION" ]; then
            name="karoo-statusbar-temp-${RELEASE_VERSION#v}.apk"
          else
            name="karoo-statusbar-temp-build${BUILD_NUMBER}.apk"
          fi
          cp app/build/outputs/apk/release/app-release.apk "$name"
          echo "APK_NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: karoo-statusbar-temp
          path: ${{ env.APK_NAME }}

      - name: Write Karoo app manifest
        if: env.RELEASE_VERSION != ''
        run: |
          # The APK name changes with every version, so link to this release's file.
          jq -n \
            --arg apk "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_VERSION}/${APK_NAME}" \
            --arg version "${RELEASE_VERSION#v}" \
            --argjson code "$BUILD_NUMBER" \
            --arg developer "github.com/${GITHUB_REPOSITORY_OWNER}" \
            '{
              label: "Status Bar Temp",
              packageName: "io.github.ulope.karoostatusbartemp",
              latestApkUrl: $apk,
              latestVersion: $version,
              latestVersionCode: $code,
              developer: $developer,
              description: "Shows the current air temperature in the top bar of the ride screen, between the ride time and the battery level.",
              tags: ["weather", "utility"]
            }' > manifest.json
          cat manifest.json

      - name: Publish release
        if: env.RELEASE_VERSION != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          files: |
            ${{ env.APK_NAME }}
            manifest.json
