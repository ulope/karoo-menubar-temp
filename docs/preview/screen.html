<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "RC"; src: url("fonts/RobotoCondensed-wght.ttf"); font-weight: 100 900; }
  @font-face { font-family: "Plex"; src: url("fonts/IBMPlexSansCondensed-Regular.ttf"); font-weight: 400; }
  @font-face { font-family: "Plex"; src: url("fonts/IBMPlexSansCondensed-Medium.ttf"); font-weight: 500; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 480px; height: 800px; background: #dfe5ef; overflow: hidden; }
  .screen { position: relative; width: 480px; height: 800px; }

  /* Top status row, laid out like the Karoo 3 ride app (see the app's diagnostics). */
  .top {
    position: absolute; left: 0; top: 0; width: 480px; height: 58px;
    background: #f3f5f9; display: flex; align-items: baseline;
    padding: 0 8px; color: #111;
    font-family: "RC"; font-feature-settings: "tnum";
  }
  .big { font-weight: 300; font-size: 55px; line-height: 58px; letter-spacing: -0.2px; }
  .small { font-weight: 400; font-size: 41px; line-height: 58px; }
  .gap { flex: 1; text-align: center; }
  .temp { font-weight: 400; font-size: 41px; }
  .battery { width: 18px; height: 34px; margin: 0 9px 0 8px; align-self: center; position: relative; top: 1px; }

  .grid {
    position: absolute; left: 6px; right: 6px; top: 64px; bottom: 62px;
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 1fr); gap: 6px;
  }
  .card {
    background: #fbf9f4; border-radius: 12px; position: relative;
    box-shadow: 0 1px 0 rgba(0, 0, 0, 0.06);
  }
  .label {
    position: absolute; top: 14px; right: 12px;
    font-family: "Plex"; font-weight: 500; font-size: 27px; letter-spacing: 0.3px; color: #2b2b2b;
  }
  .icon { position: absolute; top: 18px; left: 12px; width: 30px; height: 26px; }
  .value {
    position: absolute; right: 10px; bottom: 6px;
    font-family: "RC"; font-weight: 300; font-size: 104px; line-height: 1; color: #111;
    font-feature-settings: "tnum";
  }
  .unit { font-size: 30px; font-weight: 400; color: #555; margin-left: 2px; }

  .bottom {
    position: absolute; left: 0; right: 0; bottom: 0; height: 56px; background: #e9edf3;
    border-top: 1px solid #d3d9e3;
  }
  .bottom svg { position: absolute; top: 13px; }
</style>
</head>
<body>
<div class="screen">
  <div class="top">
    <span class="big">1:24:37</span>
    <span class="gap"><span class="temp">18°</span></span>
    <span class="small">94%</span>
    <svg class="battery" viewBox="0 0 18 34">
      <rect x="5" y="0" width="8" height="3" rx="1" fill="#111"/>
      <rect x="1" y="3" width="16" height="30" rx="2.5" fill="none" stroke="#111" stroke-width="2"/>
      <rect x="3.5" y="6" width="11" height="24.5" rx="1" fill="#111"/>
    </svg>
    <span class="big">10:42</span>
  </div>

  <div class="grid">
    <div class="card">
      <svg class="icon" viewBox="0 0 30 26"><path d="M3 22a12 12 0 0 1 24 0" fill="none" stroke="#3f9d7a" stroke-width="2.6" stroke-linecap="round"/><path d="M15 22l6-8" stroke="#3f9d7a" stroke-width="2.6" stroke-linecap="round"/></svg>
      <div class="label">SPEED</div><div class="value">27.4</div>
    </div>
    <div class="card">
      <svg class="icon" viewBox="0 0 30 26"><circle cx="7" cy="6" r="4" fill="none" stroke="#3f9d7a" stroke-width="2.4"/><circle cx="23" cy="20" r="4" fill="none" stroke="#3f9d7a" stroke-width="2.4"/><path d="M7 10v4a4 4 0 0 0 4 4h8" fill="none" stroke="#3f9d7a" stroke-width="2.4"/></svg>
      <div class="label">DISTANCE</div><div class="value">38.2</div>
    </div>
    <div class="card">
      <svg class="icon" viewBox="0 0 30 26"><path d="M17 2L7 15h8l-3 9 11-14h-8z" fill="none" stroke="#3f9d7a" stroke-width="2.4" stroke-linejoin="round"/></svg>
      <div class="label">3S POWER</div><div class="value">214</div>
    </div>
    <div class="card">
      <svg class="icon" viewBox="0 0 30 26"><path d="M15 24S3 16 3 9a6 6 0 0 1 12-2 6 6 0 0 1 12 2c0 7-12 15-12 15z" fill="none" stroke="#3f9d7a" stroke-width="2.4" stroke-linejoin="round"/></svg>
      <div class="label">HEART RATE</div><div class="value">138</div>
    </div>
    <div class="card">
      <svg class="icon" viewBox="0 0 30 26"><circle cx="13" cy="13" r="9" fill="none" stroke="#3f9d7a" stroke-width="2.4"/><path d="M4 24L24 2" stroke="#3f9d7a" stroke-width="2.4" stroke-linecap="round"/></svg>
      <div class="label">CADENCE</div><div class="value">88</div>
    </div>
    <div class="card">
      <svg class="icon" viewBox="0 0 30 26"><path d="M2 23l7-14 5 8 5-12 9 18" fill="none" stroke="#3f9d7a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/></svg>
      <div class="label">ELEVATION</div><div class="value">342</div>
    </div>
  </div>

  <div class="bottom">
    <svg style="left:16px" width="30" height="30" viewBox="0 0 30 30"><path d="M24 15a9 9 0 1 1-3-6.7" fill="none" stroke="#6a5fd3" stroke-width="2.6" stroke-linecap="round"/><path d="M22 3v7h-7" fill="#6a5fd3" stroke="#6a5fd3" stroke-width="1" stroke-linejoin="round"/></svg>
    <svg style="right:18px" width="24" height="30" viewBox="0 0 24 30"><rect x="5" y="6" width="4.5" height="18" fill="#222"/><rect x="14.5" y="6" width="4.5" height="18" fill="#222"/></svg>
  </div>
</div>
</body>
</html>
